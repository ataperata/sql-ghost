name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SQLGHOST_TEST_PG: postgresql://postgres:postgres@localhost:5432/ghost_src
      SQLGHOST_TEST_PG_SHADOW: postgresql://postgres:postgres@localhost:5432/ghost_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Create test databases
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE ghost_src"
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE ghost_shadow"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
      - name: Offline demo
        run: sqlghost demo
